name: Finalize technical supplement publication

on:
  push:
    branches: [publication-finalize]
    paths: ['.github/workflows/finalize-publication.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication-finalize
          fetch-depth: 0

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-publishers texlive-fonts-recommended poppler-utils

      - name: Reconstruct clean supplement repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scft-final
          cp LICENSE /tmp/LICENSE
          cat .publication-core/part*.b64 | base64 -d | tar -xJf - -C /tmp/scft-final

          git rm -rf .
          cp -a /tmp/scft-final/. .
          cp /tmp/LICENSE LICENSE

          rm -f manuscripts/SCFT_A_Main.tex PROVENANCE.json VALIDATION_REPORT.json
          mv manuscripts manuscript
          rm -f scripts/build_manuscripts.py

          cat > README.md <<'EOF'
          # Space-Clock Field Theory A — Technical Supplement & Reproducibility

          This repository is the publication support package for **SCFT-A: Technical Companion and Reproducibility Certificate** by Mauro Alfonso Montenegro.

          The repository intentionally contains **only the technical supplement and its reproducibility materials**. The long-form main manuscript is not mirrored here.

          ## Included

          - `manuscript/SCFT_A_Technical_Companion.pdf` — final 31-page technical supplement.
          - `manuscript/SCFT_A_Technical_Companion.tex` — exact LaTeX source.
          - `scripts/verify_wellposedness.py` — exact algebraic/structural certificate for the local nonlinear vacuum Cauchy theorem.
          - `data/proof_certificate.json` — theorem scope and PASS ledger.
          - `data/exact_symbol_checks.json` — exact matrices, spectra, Schur sign and zero residuals.
          - `data/exact_benchmark.csv` — exact unrounded representative-point values.
          - `data/operator_order_ledger.csv` — spatial operator order accounting.
          - `data/literature_sources.csv` and `data/search_queries.csv` — applicability/search ledgers.

          Additional coefficient and numerical reproduction scripts/certificates are kept alongside these files when they correspond to the final supplement.

          ## Nonlinear theorem scope

          The supplement records local Hadamard well-posedness for the **vacuum gravity-clock sector** on an open strongly Dirac-regular component of a compact boundaryless three-torus. It includes local existence, uniqueness, continuous dependence, higher-regularity persistence, constraint propagation and a continuation criterion.

          It does **not** claim global existence or long-time nonlinear stability, bounded-domain initial-boundary-value well-posedness, unconditional evolution for an unspecified visible-matter functional, or quantum/strong-coupling control.

          The machine verifier checks exact algebra and artifact integrity. It does not replace expert review of the functional-analytic proof in the supplement.

          ## Build

          ```bash
          python3 -m pip install -r requirements.txt
          python3 scripts/verify_wellposedness.py
          python3 scripts/build_supplement.py
          ```

          The supplement source is audited as a standalone 31-page build with stable references and no overfull boxes.

          ## License

          CC0 1.0 Universal. See `LICENSE`.
          EOF

          sed -i 's/^          //' README.md

          cat > CITATION.cff <<'EOF'
          cff-version: 1.2.0
          message: "If you use this technical supplement, data, or code, please cite the SCFT-A technical companion and this repository."
          title: "SCFT-A Technical Companion and Reproducibility Package"
          type: dataset
          authors:
            - given-names: Mauro Alfonso
              family-names: Montenegro
          version: "2026-09-08-final-supplement"
          date-released: 2026-09-08
          repository-code: "https://github.com/mauromontenegro333/Space-Clock-Field-Theory-A"
          keywords:
            - Space-Clock Field Theory
            - SCFT-A
            - modified gravity
            - clock field
            - nonlinear well-posedness
            - reproducibility
          license: CC0-1.0
          EOF
          sed -i 's/^          //' CITATION.cff

          cat > requirements.txt <<'EOF'
          numpy==2.3.5
          scipy==1.17.0
          sympy==1.14.0
          mpmath==1.3.0
          python-flint==0.9.0
          EOF
          sed -i 's/^          //' requirements.txt

          cat > .gitignore <<'EOF'
          build/
          *.aux
          *.log
          *.out
          *.toc
          *.synctex.gz
          __pycache__/
          *.pyc
          EOF
          sed -i 's/^          //' .gitignore

          cat > scripts/build_supplement.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import re, shutil, subprocess
          ROOT = Path(__file__).resolve().parents[1]
          SRC = ROOT / 'manuscript' / 'SCFT_A_Technical_Companion.tex'
          OUT = ROOT / 'manuscript' / 'SCFT_A_Technical_Companion.pdf'
          BUILD = ROOT / 'build'
          BUILD.mkdir(exist_ok=True)
          engine = shutil.which('pdflatex')
          if engine is None:
              raise SystemExit('pdflatex is required (TeX Live or MiKTeX).')
          for i in range(3):
              r = subprocess.run([engine, '-interaction=nonstopmode', '-halt-on-error', '-file-line-error', '-output-directory', str(BUILD), str(SRC)], cwd=ROOT, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (BUILD / f'supplement_pass_{i+1}.txt').write_text(r.stdout)
              if r.returncode:
                  raise SystemExit(r.stdout[-7000:])
          log = (BUILD / 'SCFT_A_Technical_Companion.log').read_text(errors='replace')
          bad = [p for p in [r'There were undefined references', r'There were undefined citations', r'Overfull \\hbox', r'Overfull \\vbox', r'! LaTeX Error'] if re.search(p, log)]
          if bad:
              raise SystemExit('Build audit failed: ' + ', '.join(bad))
          shutil.copy2(BUILD / 'SCFT_A_Technical_Companion.pdf', OUT)
          print(OUT)
          PY
          sed -i 's/^          //' scripts/build_supplement.py
          chmod +x scripts/build_supplement.py

          python3 scripts/build_supplement.py
          pages=$(pdfinfo manuscript/SCFT_A_Technical_Companion.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" = "31"

          find . -type f ! -path './.git/*' ! -path './build/*' ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize SCFT-A technical supplement publication repository'
          git push origin HEAD:publication-finalize

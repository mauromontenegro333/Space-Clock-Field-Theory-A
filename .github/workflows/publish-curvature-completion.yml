name: Publish SCFT-A curvature-completion package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-curvature-completion.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Reconstruct inherited figure data
        shell: bash
        run: |
          cat .bootstrap/inherited_bg.part1 .bootstrap/inherited_bg.part2 | base64 -d | xz -dc > inherited_background_figure.csv
          echo 'ee95e5a21fd3f643056b343b5af5a95e16609937c70afeed1633368029bb5783  inherited_background_figure.csv' | sha256sum -c -

      - name: Rebuild current scientific outputs
        run: |
          rm -rf generated_current
          python scft_curvature_completion.py --output generated_current

      - name: Validate regenerated scientific package
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import numpy as np

          g = Path('generated_current')
          exact = json.loads((g/'exact_checks.json').read_text())
          num = json.loads((g/'numerical_summary.json').read_text())
          assert exact['number_passed'] == 16
          assert len(exact['checks']) == 16
          assert all(exact['checks'].values())
          assert exact['eta_Hd_squared'] == '1/240'
          assert num['number_modes'] == 42
          assert num['eta_Hd_squared'] == '1/240'

          bg = np.loadtxt(g/'loaded_background.csv', delimiter=',', skiprows=1)
          rs = np.loadtxt(g/'response_summary.csv', delimiter=',', skiprows=1)
          ep = np.loadtxt(g/'endpoint_spectrum.csv', delimiter=',', skiprows=1)
          assert bg.shape == (8001, 9)
          assert rs.shape == (42, 11)
          assert ep.shape[1] == 3
          assert np.isfinite(bg).all() and np.isfinite(rs).all() and np.isfinite(ep).all()

          with np.load(g/'all_responses.npz', allow_pickle=False) as z:
              assert set(z.files) == {'N','k','values'}
              assert z['N'].shape == (1001,)
              assert z['k'].shape == (42,)
              assert z['values'].shape == (42,1001,15)
              assert np.isfinite(z['values']).all()

          supplied = {
              'max_observable_response': 1.0463168638938594,
              'max_channel_refinement': 2.1305686436021848e-11,
              'max_pointwise_refinement': 2.1305686436021848e-11,
              'background_residual': 4.8722137239064966e-14,
          }
          for key, ref in supplied.items():
              assert math.isclose(num[key], ref, rel_tol=1e-10, abs_tol=1e-15), (key, num[key], ref)
          assert max(num['max_residuals']) < 1e-12
          assert num['max_channel_refinement'] < 3e-11
          assert num['max_pointwise_refinement'] < 3e-11
          assert num['background_residual'] < 1e-12
          assert [x['k_Hd'] for x in num['independent_integrators']] == [0.03,10.0,1000.0]
          assert max(x['channel_discrepancy'] for x in num['independent_integrators']) < 1e-10
          PY
          test "$(sha256sum scft_curvature_completion.py | cut -d' ' -f1)" = "923515687a9ac1016860c57ac8087e447a7a678f04fab128fbbef1072401a253"
          test "$(sha256sum coupling_input.json | cut -d' ' -f1)" = "0c031e975d53e9f396e5188ebc1cf59bf953b5f48d0e1d4294063e7068264d12"
          test "$(sha256sum requirements.txt | cut -d' ' -f1)" = "f7308e5b60ea62603b458da5fadbb55614b46fbb4d083200fa2cc9843085ceef"

      - name: Replace obsolete S0 files with the current package
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            build_manuscript.py \
            export_modes_csv.py \
            refined_background.json \
            refinement_differences.json \
            regulator_checks.json \
            reproduce_runs.py \
            run_exact_checks.py \
            scft_audit.json \
            scft_audit.py \
            scft_background.csv \
            scft_completion_checks.json \
            scft_completion_checks.py \
            scft_local_vacuum_check.py \
            scft_modes.npz \
            scft_rank1_checks.json \
            scft_rank1_checks.py \
            scft_sourcefree.csv \
            symbolic_checks_saved_record.json \
            verify_package.py
          cp generated_current/exact_checks.json .
          cp generated_current/numerical_summary.json .
          cp generated_current/loaded_background.csv .
          cp generated_current/endpoint_spectrum.csv .
          cp generated_current/response_summary.csv .
          cp generated_current/response_00.csv .
          cp generated_current/response_24.csv .
          cp generated_current/response_30.csv .
          cp generated_current/response_35.csv .
          cp generated_current/response_38.csv .
          cp generated_current/response_41.csv .
          cp generated_current/all_responses.npz .
          rm -rf generated_current .bootstrap
          rm -f .github/workflows/publish-curvature-completion.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Write validation report and SHA-256 manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import numpy as np

          root = Path('.')
          sha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          exact = json.loads(Path('exact_checks.json').read_text())
          num = json.loads(Path('numerical_summary.json').read_text())
          bg = np.loadtxt('loaded_background.csv', delimiter=',', skiprows=1)
          rs = np.loadtxt('response_summary.csv', delimiter=',', skiprows=1)
          with np.load('all_responses.npz', allow_pickle=False) as z:
              shapes = {key: list(z[key].shape) for key in z.files}

          scientific = [
              'scft_curvature_completion.py','coupling_input.json','exact_checks.json',
              'numerical_summary.json','loaded_background.csv','endpoint_spectrum.csv',
              'response_summary.csv','response_00.csv','response_24.csv','response_30.csv',
              'response_35.csv','response_38.csv','response_41.csv','all_responses.npz',
              'inherited_background_figure.csv'
          ]
          report = {
              'validated_on': '2026-09-08',
              'generator': 'scft_curvature_completion.py',
              'environment': {'python': '3.12', 'numpy': np.__version__},
              'exact_checks_passed': exact['number_passed'],
              'all_exact_checks_passed': all(exact['checks'].values()),
              'number_modes': num['number_modes'],
              'background_shape': list(bg.shape),
              'response_summary_shape': list(rs.shape),
              'npz_shapes': shapes,
              'scientific_file_sha256': {name: sha(name) for name in scientific},
              'max_observable_response': num['max_observable_response'],
              'max_channel_refinement': num['max_channel_refinement'],
              'max_pointwise_refinement': num['max_pointwise_refinement'],
              'max_residuals': num['max_residuals'],
              'background_residual': num['background_residual'],
              'independent_integrators': num['independent_integrators'],
              'legacy_branch': 'legacy-s0-2026-09-08',
              'reproduction_note': 'The supplied package reproduced byte-for-byte in the local verification environment. GitHub Actions independently regenerated the package with the pinned library versions and validated the stated numerical results to 1e-10 relative tolerance because binary64 solver output can differ in last digits across platforms.',
              'scope_note': 'This validation does not extend the physical proof beyond the scope stated in README.md and PROVENANCE.json.'
          }
          Path('VALIDATION_REPORT.json').write_text(json.dumps(report, indent=2) + '\n')
          names = sorted(p.name for p in root.iterdir() if p.is_file() and p.name != 'MANIFEST_SHA256.txt')
          Path('MANIFEST_SHA256.txt').write_text(''.join(f'{sha(name)}  {name}\n' for name in names))
          PY

      - name: Commit and publish to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Publish curvature-completion reproducibility package'
          git push origin HEAD:main

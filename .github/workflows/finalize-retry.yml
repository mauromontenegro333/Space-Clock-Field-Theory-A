name: Finalize supplement retry
on:
  push:
    branches: [publication-finalize]
    paths: ['.github/workflows/finalize-retry.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication-finalize
          fetch-depth: 0
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-publishers texlive-fonts-recommended poppler-utils
      - name: Build clean technical-supplement repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/scft-final && mkdir -p /tmp/scft-final
          cp LICENSE /tmp/LICENSE
          cat .publication-core/part*.b64 | base64 -d | tar -xJf - -C /tmp/scft-final
          git rm -rf .
          cp -a /tmp/scft-final/. .
          cp /tmp/LICENSE LICENSE
          rm -f manuscripts/SCFT_A_Main.tex PROVENANCE.json VALIDATION_REPORT.json scripts/build_manuscripts.py
          mv manuscripts manuscript
          cat > README.md <<'EOF'
          # Space-Clock Field Theory A — Technical Supplement & Reproducibility

          Publication support repository for **SCFT-A: Technical Companion and Reproducibility Certificate** by Mauro Alfonso Montenegro.

          This repository intentionally contains **only the technical supplement and its reproducibility materials**. The long-form main manuscript is not included here in either PDF or LaTeX form.

          ## Publication file
          - `manuscript/SCFT_A_Technical_Companion.pdf` — final 31-page technical supplement.
          - `manuscript/SCFT_A_Technical_Companion.tex` — exact integrated LaTeX source.

          ## Reproducibility
          - `scripts/verify_wellposedness.py` — exact algebraic/structural verification for the local nonlinear vacuum Cauchy theorem.
          - `data/proof_certificate.json` — theorem scope and PASS ledger.
          - `data/exact_symbol_checks.json` — exact matrices, spectra, Schur sign, and zero residuals.
          - `data/exact_benchmark.csv` — exact unrounded benchmark values.
          - `data/operator_order_ledger.csv` — operator-order accounting.

          The local theorem concerns the vacuum gravity-clock sector on an open strongly Dirac-regular component of a compact boundaryless three-torus. It does not claim global nonlinear stability, bounded-domain well-posedness, unrestricted visible-matter evolution, or quantum/strong-coupling control. Machine checks certify algebra and artifact integrity; the functional-analytic proof remains the technical supplement itself.

          ## Build
          ```bash
          python3 -m pip install -r requirements.txt
          python3 scripts/verify_wellposedness.py
          ```
          To build the supplement, run `pdflatex` three times on `manuscript/SCFT_A_Technical_Companion.tex`.

          ## License
          CC0 1.0 Universal. See `LICENSE`.
          EOF
          sed -i 's/^          //' README.md
          cat > CITATION.cff <<'EOF'
          cff-version: 1.2.0
          message: "If you use this technical supplement, data, or code, please cite the SCFT-A technical companion and this repository."
          title: "SCFT-A Technical Companion and Reproducibility Package"
          type: dataset
          authors:
            - given-names: Mauro Alfonso
              family-names: Montenegro
          version: "2026-09-08-final-supplement"
          date-released: 2026-09-08
          repository-code: "https://github.com/mauromontenegro333/Space-Clock-Field-Theory-A"
          license: CC0-1.0
          EOF
          sed -i 's/^          //' CITATION.cff
          mkdir -p build
          for n in 1 2 3; do pdflatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory build manuscript/SCFT_A_Technical_Companion.tex > build/pass$n.txt; done
          if grep -Eq 'There were undefined references|There were undefined citations|Overfull \\hbox|Overfull \\vbox|! LaTeX Error' build/SCFT_A_Technical_Companion.log; then exit 1; fi
          test "$(pdfinfo build/SCFT_A_Technical_Companion.pdf | awk '/^Pages:/ {print $2}')" = "31"
          cp build/SCFT_A_Technical_Companion.pdf manuscript/SCFT_A_Technical_Companion.pdf
          rm -rf build
          cat > .gitignore <<'EOF'
          build/
          *.aux
          *.log
          *.out
          *.toc
          *.synctex.gz
          __pycache__/
          *.pyc
          EOF
          sed -i 's/^          //' .gitignore
          find . -type f ! -path './.git/*' ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize SCFT-A technical supplement publication repository'
          git push origin HEAD:publication-finalize
